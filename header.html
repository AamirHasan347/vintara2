<style>
/* === NAVBAR === */
.v-sticky-navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 999;
  height: 100px;
  display: flex;
  align-items: center;
  transition: background-color 0.4s ease, backdrop-filter 0.4s ease,
    box-shadow 0.4s ease;
}

.v-sticky-navbar-transparent {
  background: transparent;
  backdrop-filter: none;
  box-shadow: none;
}

.v-sticky-navbar-scrolled {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  box-shadow: 0 5px 20px rgba(12, 72, 51, 0.1);
}

.v-navbar-inner {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  height: 100%;
}

.v-navbar-left {
  display: flex;
  align-items: center;
}

.v-navbar-logo {
  height: 256px;
  margin: 32px 32px 0 0;
  padding: 32px;
  margin-right: 2rem;
  transition: 0.3s ease;
}
.logo-green {
  display: none;
}
.logo-white {
  display: block;
}

/* Logo visibility on scroll */
.v-sticky-navbar-scrolled .logo-white {
  display: none;
}
.v-sticky-navbar-scrolled .logo-green {
  display: block;
}

.v-navbar-menu {
  display: flex;
  gap: 2rem;
  list-style: none;
  padding: 0;
  margin: 0;
}

.v-navbar-link {
  font-family: var(--font-title);
  font-size: 1.1rem;
  font-weight: 700;
  text-decoration: none;
  color: white;
  transition: color 0.3s ease;
  position: relative;
}
.v-navbar-link::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  background: white;
  left: 0;
  bottom: -4px;
  transition: width 0.3s ease;
}
.v-navbar-link:hover::after {
  width: 100%;
}

.v-sticky-navbar-scrolled .v-navbar-link {
  color: var(--primary);
}
.v-sticky-navbar-scrolled .v-navbar-link::after {
  background: var(--primary);
}

/* ENQUIRE button */
.v-btn.v-navbar-enquire {
  border: 2px solid white;
  color: white;
  background: transparent;
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  font-weight: 600;
  font-size: 1rem;
  transition: all 0.3s ease;
  text-decoration: none; /* ✅ Fix underline */
}
.v-btn.v-navbar-enquire:hover {
  background: white;
  color: var(--primary);
}
.v-sticky-navbar-scrolled .v-btn.v-navbar-enquire {
  border: 2px solid var(--primary);
  color: var(--primary);
  background: white;
}

@media (max-width: 1024px) {
  .v-navbar-right .v-btn.v-navbar-enquire {
    display: none !important;
  }
}

.about-hero {
  position: relative;
  width: 100%;
  min-height: 75vh;
  background-image: url("images/ABOUT\ 1\ BACKGROUND\ NEW.jpg");
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  text-align: left;
  padding: 6rem 2rem 4rem 2rem;
}

.about-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem;
  color: white;
  z-index: 100;
}

.about-content h1 {
  font-family: var(--font-title);
  font-size: 4rem;
  font-weight: 700;
  margin-bottom: 1.2rem;
}

.about-content p {
  font-family: var(--font-main);
  font-size: 1.3rem;
  line-height: 1.6;
  margin-bottom: 1rem;
}

/* === HAMBURGER MENU === */
.v-navbar-hamburger {
  display: none;
  flex-direction: column;
  gap: 6px;
  background: none;
  border: none;
  cursor: pointer;
  z-index: 1200;
}
.v-navbar-hamburger span {
  height: 3px;
  width: 24px;
  background: var(--primary);
  border-radius: 3px;
}

@media (max-width: 1024px) {
  .v-navbar-menu {
    display: none !important;
  }
  .v-navbar-hamburger {
    display: flex !important;
  }
  .v-navbar-right .v-btn.v-navbar-enquire {
    display: none !important;
  }
}

/* === MOBILE MENU === */
.v-navbar-mobile-menu {
  display: none;
  flex-direction: column;
  position: fixed;
  top: 0;
  right: 0;
  width: 300px;
  height: 100vh;
  background: var(--secondary);
  box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
  padding: 5rem 2rem;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  z-index: 1100;
}
.v-navbar-mobile-menu.active {
  transform: translateX(0%);
  display: flex;
}

.v-navbar-mobile-menu ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.v-navbar-mobile-menu .v-navbar-link {
  font-size: 1.2rem;
  font-family: var(--font-title);
  color: var(--primary);
  text-decoration: none;
}

.v-navbar-mobile-menu .v-navbar-link:hover {
  color: #176b4c;
}

.v-navbar-mobile-menu .v-btn.v-navbar-enquire {
  margin-top: 1rem;
  border: 2px solid var(--primary);
  color: var(--primary);
  background: transparent;
  padding: 0.6rem 1.2rem;
  font-weight: 600;
  font-size: 1rem;
  border-radius: 6px;
  text-align: center;
  text-decoration: none; /* ✅ Fix underline */
}

/* Responsive width on small screens */
@media (max-width: 480px) {
  .v-navbar-mobile-menu {
    width: 100%;
    padding: 4rem 1.2rem;
  }
}

@media (max-width: 1024px) {
  .v-navbar-inner {
    padding: 0 1rem;
  }

  .about-content {
    padding: 2rem 1rem;
  }

  .about-content h1 {
    font-size: 2.8rem;
  }

  .about-content p {
    font-size: 1.1rem;
  }
}

@media (max-width: 768px) {

  .v-navbar-mobile-menu {
    width: 100%;
    padding: 5rem 1.5rem;
  }
}

@media (max-width: 480px) {

  .v-navbar-mobile-menu {
    padding: 4rem 1rem;
  }

  .v-navbar-mobile-menu .v-navbar-link {
    font-size: 1.1rem;
  }
}
</style>

<script>
  // Scroll-based navbar + logo swap
window.addEventListener("scroll", function () {
  const navbar = document.getElementById("StickyNavbar");
  // const logo = document.getElementById("navbarLogo");
  const links = document.querySelectorAll(".v-navbar-link");
  const scrolled = window.scrollY > 80;

  if (scrolled) {
    navbar.classList.add("v-sticky-navbar-scrolled");
    navbar.classList.remove("v-sticky-navbar-transparent");
    // logo.src = "images/vintaraLogoGreen.svg";
    links.forEach((link) => (link.style.color = "#0c4833"));
  } else {
    navbar.classList.remove("v-sticky-navbar-scrolled");
    navbar.classList.add("v-sticky-navbar-transparent");
    // logo.src = "images/vintaraLogoWhite";
    links.forEach((link) => (link.style.color = "#ffffff"));
  }
});

// Mobile menu toggle functionality
document.addEventListener("DOMContentLoaded", function () {
  const hamburger = document.getElementById("vNavbarHamburger");
  const mobileMenu = document.getElementById("vNavbarMobileMenu");
  const body = document.body;

  if (hamburger && mobileMenu) {
    hamburger.addEventListener("click", function () {
      const isActive = hamburger.classList.contains("active");

      if (isActive) {
        // Close menu
        hamburger.classList.remove("active");
        mobileMenu.classList.remove("active");
        body.style.overflow = "";
      } else {
        // Open menu
        hamburger.classList.add("active");
        mobileMenu.classList.add("active");
        body.style.overflow = "hidden"; // Prevent background scrolling
      }
    });

    // Close menu when clicking on mobile menu links
    const mobileMenuLinks = mobileMenu.querySelectorAll("a");
    mobileMenuLinks.forEach((link) => {
      link.addEventListener("click", function () {
        hamburger.classList.remove("active");
        mobileMenu.classList.remove("active");
        body.style.overflow = "";
      });
    });

    // Close menu when clicking outside
    document.addEventListener("click", function (event) {
      if (
        !hamburger.contains(event.target) &&
        !mobileMenu.contains(event.target)
      ) {
        hamburger.classList.remove("active");
        mobileMenu.classList.remove("active");
        body.style.overflow = "";
      }
    });

    // Close menu on window resize if screen becomes larger
    window.addEventListener("resize", function () {
      if (window.innerWidth > 1024) {
        hamburger.classList.remove("active");
        mobileMenu.classList.remove("active");
        body.style.overflow = "";
      }
    });
  }
});
</script>
